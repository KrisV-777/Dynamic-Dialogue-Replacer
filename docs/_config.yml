title: Dynamic Dialogue Replacer
description: SKSE64 plugin for runtime Skyrim dialogue replacement
remote_theme: "jekyll/minima@1e8a445"

# GitHub Pages URL — update if the repo is renamed or uses a custom domain
url: "https://krisv-777.github.io"
baseurl: "/Dynamic-Dialogue-Replacer"

# Aux links shown in the top-right corner
aux_links:
  "GitHub":
    - "https://github.com/KrisV-777/Dynamic-Dialogue-Replacer"

